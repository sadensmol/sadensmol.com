name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.141.0"
    steps:
      - name: Install Hugo CLI
        env:
          HUGO_DEB: hugo_extended_0.141.0_linux-amd64.deb
        run: |
          wget -O "${{ runner.temp }}/${HUGO_DEB}" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_DEB}" \
          && sudo dpkg -i "${{ runner.temp }}/${HUGO_DEB}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${BASE_URL}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-medium:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Check for Medium token
        id: check-token
        env:
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
        run: |
          if [[ -z "$MEDIUM_TOKEN" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "MEDIUM_TOKEN not set, skipping Medium publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new posts and publish to Medium
        if: steps.check-token.outputs.skip != 'true'
        env:
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
        run: |
          new_posts=$(git diff --diff-filter=A --name-only ${{ github.event.before }}..${{ github.sha }} -- 'content/posts/*.md')
          if [[ -z "$new_posts" ]]; then
            echo "No new posts found"
            exit 0
          fi
          echo "New posts detected:"
          echo "$new_posts"
          while IFS= read -r post; do
            echo "---"
            echo "Publishing: $post"
            bash scripts/publish-medium.sh "$post"
          done <<< "$new_posts"
