baseURL = "https://sadensmol.com/"
languageCode = "en-us"
title = "sadensmol"
copyright = "sadensmol"
enableRobotsTXT = true

[permalinks]
  [permalinks.page]
    posts = "/posts/:year/:month/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[menus]
  [[menus.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  description = "Personal blog and notes by Denis Sazonov — backend engineer working on fintech, iGaming, and distributed systems in Go."
  author = "Denis Sazonov"
  image = "/images/profile.jpg"
  twitter_handle = "sadensmol"
