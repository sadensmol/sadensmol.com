{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ range .Pages.GroupByDate "2006" "desc" }}
<section class="posts-year">
  <h2>{{ .Key }}</h2>
  {{ range .Pages.GroupByDate "January" "desc" }}
  <h3>{{ .Key }}</h3>
  <ul class="post-list">
    {{- range .Pages }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{- end }}
  </ul>
  {{ end }}
</section>
{{ end }}
{{ end }}
